<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Chamadas - Barbearia LC do Corte</title>

  <!-- Bibliotecas do Firebase e QRCode -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #121212; color: #ffffff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* Topo Header */
    header { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background-color: #1e1e1e; border-bottom: 3px solid #d32f2f; }
    .clock { font-size: 2rem; font-weight: bold; color: #ffca28; font-family: monospace; }
    .title { font-size: 2rem; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; }
    .btn-fullscreen { background: #d32f2f; color: white; border: none; padding: 10px 20px; font-weight: bold; font-size: 1rem; cursor: pointer; border-radius: 5px; z-index: 1000; }
    .btn-fullscreen:active { background: #b71c1c; }

    /* Layout Principal */
    main { display: flex; flex: 1; padding: 20px; gap: 20px; height: calc(100vh - 140px); }

    /* Lado Esquerdo: Painel de Chamada */
    .left-panel { flex: 1.2; display: flex; flex-direction: column; gap: 20px; }
    .ticket-card { background: #1e1e1e; border-radius: 15px; padding: 30px; text-align: center; border: 2px solid #333; box-shadow: 0 8px 16px rgba(0,0,0,0.5); }
    .ticket-label { font-size: 1.5rem; color: #aaa; text-transform: uppercase; margin-bottom: 10px; }
    .ticket-number { font-size: 5.5rem; font-weight: bold; color: #00e676; letter-spacing: 3px; }
    .desk-number { font-size: 2.5rem; color: #ffca28; margin-top: 10px; }

    /* Player do YouTube e QR Code */
    .video-container { position: relative; background: #000; border-radius: 15px; overflow: hidden; flex: 1; min-height: 200px; }
    #player { width: 100%; height: 100%; border: none; }
    .qr-box { position: absolute; top: 10px; right: 10px; background: rgba(255, 255, 255, 0.9); padding: 8px; border-radius: 8px; text-align: center; color: #000; font-size: 0.7rem; font-weight: bold; z-index: 10; }

    /* Lado Direito: Histórico e Controles */
    .right-panel { flex: 0.8; display: flex; flex-direction: column; gap: 20px; }
    .history-card { background: #1e1e1e; border-radius: 15px; padding: 20px; flex: 1; border: 2px solid #333; }
    .history-card h3 { border-bottom: 2px solid #d32f2f; padding-bottom: 10px; margin-bottom: 15px; color: #ffca28; }
    .history-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .history-item { background: #2a2a2a; padding: 12px 20px; border-radius: 8px; display: flex; justify-content: space-between; font-size: 1.3rem; }

    /* Botões de Ação Simulação */
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn-call { padding: 15px; font-size: 1.1rem; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; color: white; }
    .btn-normal { background: #0288d1; }
    .btn-pref { background: #ed6c02; }

    /* Letreiro Rolante */
    footer { background: #d32f2f; color: white; padding: 10px 0; overflow: hidden; white-space: nowrap; }
    .marquee { display: inline-block; font-size: 1.4rem; font-weight: bold; animation: marquee 32s linear infinite; }
    .fast-marquee { animation-duration: 16s !important; }

    @keyframes marquee {
      0% { transform: translateX(100vw); }
      100% { transform: translateX(-100%); }
    }
  </style>
</head>
<body>

  <header>
    <div class="clock" id="clock">00:00:00</div>
    <div class="title">Barbearia LC do Corte</div>
    <button class="btn-fullscreen" onclick="toggleFullScreen()">Tela Cheia ⛶</button>
  </header>

  <main>
    <!-- Painel de Chamada e Vídeo -->
    <section class="left-panel">
      <div class="ticket-card">
        <div class="ticket-label">Senha Atual</div>
        <div class="ticket-number" id="currentTicket">---</div>
        <div class="desk-number" id="currentDesk">Aguardando...</div>
      </div>

      <div class="video-container">
        <div id="player"></div>
        <!-- QR Code para troca de vídeo pelo Celular -->
        <div class="qr-box">
          <div id="qrcode"></div>
          <span>Trocar Vídeo</span>
        </div>
      </div>
    </section>

    <!-- Histórico e Botões -->
    <section class="right-panel">
      <div class="history-card">
        <h3>Últimas Chamadas</h3>
        <ul class="history-list" id="historyList">
          <li class="history-item"><span>---</span> <span>---</span></li>
          <li class="history-item"><span>---</span> <span>---</span></li>
          <li class="history-item"><span>---</span> <span>---</span></li>
        </ul>
      </div>

      <div class="controls">
        <button class="btn-call btn-normal" onclick="chamarSenha('N')">Chamar Normal</button>
        <button class="btn-call btn-pref" onclick="chamarSenha('P')">Chamar Pref.</button>
      </div>
    </section>
  </main>

  <footer>
    <div class="marquee" id="marqueeText">BEM-VINDO À BARBEARIA LC DO CORTE! FALE COM O BARBEIRO PARA GERAR A SENHA E AGUARDE NO PAINEL. ★ </div>
  </footer>

  <!-- API IFrame do YouTube -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    // -------------------------------------------------------------
    // 1. RELÓGIO DIGITAL (Forçado para iniciar com garantia)
    // -------------------------------------------------------------
    function atualizarRelogio() {
      const agora = new Date();
      const horas = String(agora.getHours()).padStart(2, '0');
      const minutos = String(agora.getMinutes()).padStart(2, '0');
      const segundos = String(agora.getSeconds()).padStart(2, '0');
      
      const elRelogio = document.getElementById('clock');
      if (elRelogio) {
        elRelogio.innerText = `${horas}:${minutos}:${segundos}`;
      }
    }
    
    // Inicia imediatamente e agenda a repetição
    atualizarRelogio();
    setInterval(atualizarRelogio, 1000);

    // -------------------------------------------------------------
    // 2. FUNÇÃO DE TELA CHEIA (Suporte Universal para TV Box / Chrome)
    // -------------------------------------------------------------
    function toggleFullScreen() {
      const doc = document.documentElement;
      
      if (!document.fullscreenElement && 
          !document.mozFullScreenElement && 
          !document.webkitFullscreenElement && 
          !document.msFullscreenElement) {
        
        // Abre em Tela Cheia
        if (doc.requestFullscreen) {
          doc.requestFullscreen().catch(err => alert("Acesse o link direto do site fora de iFrames para usar Tela Cheia."));
        } else if (doc.webkitRequestFullscreen) {
          doc.webkitRequestFullscreen();
        } else if (doc.mozRequestFullScreen) {
          doc.mozRequestFullScreen();
        } else if (doc.msRequestFullscreen) {
          doc.msRequestFullscreen();
        }
      } else {
        // Sai da Tela Cheia
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        } else if (document.mozCancelFullScreen) {
          document.mozCancelFullScreen();
        } else if (document.msExitFullscreen) {
          document.msExitFullscreen();
        }
      }
    }

    // -------------------------------------------------------------
    // 3. CONFIGURAÇÃO DO FIREBASE
    // -------------------------------------------------------------
    const firebaseConfig = {
      apiKey: "AIzaSyCrXLLSDwokGfcjx3-KFF6GnrfaFI8MGSw",
      authDomain: "painel-bom-dia.firebaseapp.com",
      databaseURL: "https://painel-bom-dia-default-rtdb.firebaseio.com",
      projectId: "painel-bom-dia",
      storageBucket: "painel-bom-dia.firebasestorage.app",
      messagingSenderId: "694985059965",
      appId: "1:694985059965:web:a2ae22fc1d627dbfc08b14"
    };

    if (firebaseConfig.apiKey !== "AIzaSyCrXLLSDwokGfcjx3-KFF6GnrfaFI8MGSw") {
      firebase.initializeApp(firebaseConfig);
      const database = firebase.database();

      database.ref('videoAtual').on('value', (snapshot) => {
        const videoId = snapshot.val();
        if (videoId && player && player.loadVideoById) {
          player.loadVideoById(videoId);
        }
      });
    }

    const URL_CONTROLE_CELULAR = "https://trocarplaylistlc.vercel.app";

    // -------------------------------------------------------------
    // 4. VARIÁVEIS DE ESTADO E SISTEMA DE CHAMADA
    // -------------------------------------------------------------
    let seqNormal = 1;
    let seqPref = 1;
    let historico = [];
    let player = null;
    let isVideoPlaying = false;
    let timerSenha = null;

    // -------------------------------------------------------------
    // 5. YOUTUBE PLAYER
    // -------------------------------------------------------------
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        videoId: 'L_LUpnjgPso',
        playerVars: {
          'autoplay': 1,
          'controls': 0,
          'loop': 1,
          'playlist': 'L_LUpnjgPso',
          'origin': window.location.origin
        },
        events: {
          'onStateChange': (event) => {
            if (event.data == YT.PlayerState.PLAYING) isVideoPlaying = true;
            if (event.data == YT.PlayerState.PAUSED) isVideoPlaying = false;
          }
        }
      });
    }

    window.addEventListener('load', () => {
      new QRCode(document.getElementById("qrcode"), {
        text: URL_CONTROLE_CELULAR,
        width: 80,
        height: 80
      });
    });

    // -------------------------------------------------------------
    // 6. LÓGICA DE CHAMADA DE SENHAS (Bancada 1 Fixa)
    // -------------------------------------------------------------
    function chamarSenha(tipo) {
      let num = tipo === 'N' ? seqNormal++ : seqPref++;
      let senhaFormatada = tipo + String(num).padStart(3, '0');
      let bancadaFixa = "Bancada 1";

      document.getElementById('currentTicket').innerText = senhaFormatada;
      document.getElementById('currentDesk').innerText = bancadaFixa;

      historico.unshift({ senha: senhaFormatada, bancada: bancadaFixa });
      if (historico.length > 3) historico.pop();
      atualizarHistoricoUI();

      const marquee = document.getElementById('marqueeText');
      marquee.innerText = `📢 ATENÇÃO: SENHA ${senhaFormatada} - FAVOR DIRIGIR-SE À BANCADA 1! 📢`;
      marquee.classList.add('fast-marquee');

      if (player && isVideoPlaying) player.pauseVideo();

      tocarSinalEAnunciar(senhaFormatada, bancadaFixa);

      clearTimeout(timerSenha);
      timerSenha = setTimeout(() => {
        document.getElementById('currentTicket').innerText = '---';
        document.getElementById('currentDesk').innerText = 'Aguardando...';
        marquee.innerText = "BEM-VINDO À BARBEARIA LC DO CORTE! FALE COM O BARBEIRO PARA GERAR A SENHA E AGUARDE NO PAINEL. ★ ";
        marquee.classList.remove('fast-marquee');
      }, 30000);
    }

    function atualizarHistoricoUI() {
      const list = document.getElementById('historyList');
      list.innerHTML = '';
      for (let i = 0; i < 3; i++) {
        let item = historico[i] || { senha: '---', bancada: '---' };
        list.innerHTML += `<li class="history-item"><span>${item.senha}</span> <span>${item.bancada}</span></li>`;
      }
    }

    function tocarSinalEAnunciar(senha, bancada) {
      let audio = new Audio('sinal.wav');

      audio.play().then(() => {
        audio.onended = () => falarTexto(senha, bancada);
      }).catch(() => {
        falarTexto(senha, bancada);
      });
    }

    function falarTexto(senha, bancada) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();

        let senhaParaVoz = senha.split('').join(' ');
        let mensagem = new SpeechSynthesisUtterance(`Senha ${senhaParaVoz}, dirigir-se à ${bancada}`);
        
        mensagem.lang = 'pt-BR';
        mensagem.rate = 0.9;

        mensagem.onend = () => {
          if (player) player.playVideo();
        };

        window.speechSynthesis.speak(mensagem);
      } else {
        if (player) player.playVideo();
      }
    }
  </script>
</body>
</html>
