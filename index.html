<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel SGA Barbearia LC do Corte</title>

  <!-- Bibliotecas do Firebase e QRCode -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #121212; color: #ffffff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* Topo Header */
    header { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background-color: #1e1e1e; border-bottom: 3px solid #d32f2f; }
    .clock { font-size: 1.8rem; font-weight: bold; color: #ffca28; }
    .title { font-size: 2rem; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; }
    .btn-fullscreen { background: #d32f2f; color: white; border: none; padding: 8px 15px; font-weight: bold; cursor: pointer; border-radius: 5px; }

    /* Layout Principal */
    main { display: flex; flex: 1; padding: 20px; gap: 20px; height: calc(100vh - 140px); }

    /* Lado Esquerdo: Painel de Chamada */
    .left-panel { flex: 1.2; display: flex; flex-direction: column; gap: 20px; }
    .ticket-card { background: #1e1e1e; border-radius: 15px; padding: 30px; text-align: center; border: 2px solid #333; box-shadow: 0 8px 16px rgba(0,0,0,0.5); }
    .ticket-label { font-size: 1.5rem; color: #aaa; text-transform: uppercase; margin-bottom: 10px; }
    .ticket-number { font-size: 5.5rem; font-weight: bold; color: #00e676; letter-spacing: 3px; }
    .desk-number { font-size: 2.5rem; color: #ffca28; margin-top: 10px; }

    /* Player do YouTube e QR Code */
    .video-container { position: relative; background: #000; border-radius: 15px; overflow: hidden; flex: 1; min-height: 200px; }
    #player { width: 100%; height: 100%; border: none; }
    .qr-box { position: absolute; top: 10px; right: 10px; background: rgba(255, 255, 255, 0.9); padding: 8px; border-radius: 8px; text-align: center; color: #000; font-size: 0.7rem; font-weight: bold; }

    /* Lado Direito: Histórico e Controles */
    .right-panel { flex: 0.8; display: flex; flex-direction: column; gap: 20px; }
    .history-card { background: #1e1e1e; border-radius: 15px; padding: 20px; flex: 1; border: 2px solid #333; }
    .history-card h3 { border-bottom: 2px solid #d32f2f; padding-bottom: 10px; margin-bottom: 15px; color: #ffca28; }
    .history-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .history-item { background: #2a2a2a; padding: 12px 20px; border-radius: 8px; display: flex; justify-content: space-between; font-size: 1.3rem; }

    /* Botões de Ação Simulação */
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn-call { padding: 15px; font-size: 1.1rem; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; color: white; }
    .btn-normal { background: #0288d1; }
    .btn-pref { background: #ed6c02; }

    /* Letreiro Rolante */
    footer { background: #d32f2f; color: white; padding: 10px 0; overflow: hidden; white-space: nowrap; }
    .marquee { display: inline-block; font-size: 1.4rem; font-weight: bold; animation: marquee 20s linear infinite; }
    .fast-marquee { animation-duration: 8s !important; }

    @keyframes marquee {
      0% { transform: translateX(100vw); }
      100% { transform: translateX(-100%); }
    }
  </style>
</head>
<body>

  <header>
    <div class="clock" id="clock">00:00:00</div>
    <div class="title">Painel feito por: João HTMLs</div>
    <button class="btn-fullscreen" onclick="toggleFullScreen()">TELA CHEIA</button>
  </header>

  <main>
    <!-- Painel de Chamada e Vídeo -->
    <section class="left-panel">
      <div class="ticket-card">
        <div class="ticket-label">Senha Atual</div>
        <div class="ticket-number" id="currentTicket">---</div>
        <div class="desk-number" id="currentDesk">Aguardando...</div>
      </div>

      <div class="video-container">
        <div id="player"></div>
        <!-- QR Code para troca de vídeo pelo Celular -->
        <div class="qr-box">
          <div id="qrcode"></div>
          <span>Trocar Vídeo</span>
        </div>
      </div>
    </section>

    <!-- Histórico e Botões -->
    <section class="right-panel">
      <div class="history-card">
        <h3>Últimas Chamadas</h3>
        <ul class="history-list" id="historyList">
          <li class="history-item"><span>---</span> <span>---</span></li>
          <li class="history-item"><span>---</span> <span>---</span></li>
          <li class="history-item"><span>---</span> <span>---</span></li>
        </ul>
      </div>

      <div class="controls">
        <button class="btn-call btn-normal" onclick="chamarSenha('N')">Chamar Normal</button>
        <button class="btn-call btn-pref" onclick="chamarSenha('P')">Chamar Pref.</button>
      </div>
    </section>
  </main>

  <footer>
    <div class="marquee" id="marqueeText">BEM-VINDO À BARBEARIA LC DO CORTE! RESPEITE A ORDEM DAS SENHAS. TENHA UM EXCELENTE ATENDIMENTO!</div>
  </footer>

  <!-- API IFrame do YouTube -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    // -------------------------------------------------------------
    // 1. CONFIGURAÇÃO DO FIREBASE (Substitua pelos seus dados!)
    // -------------------------------------------------------------
    const firebaseConfig = {
  apiKey: "AIzaSyCrXLLSDwokGfcjx3-KFF6GnrfaFI8MGSw",
  authDomain: "painel-bom-dia.firebaseapp.com",
  databaseURL: "https://painel-bom-dia-default-rtdb.firebaseio.com",
  projectId: "painel-bom-dia",
  storageBucket: "painel-bom-dia.firebasestorage.app",
  messagingSenderId: "694985059965",
  appId: "1:694985059965:web:a2ae22fc1d627dbfc08b14"
};

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // URL do seu painel web de controle no celular
    const URL_CONTROLE_CELULAR = "https://trocarplaylistdopainellc.netlify.app/controle.html";

    // -------------------------------------------------------------
    // 2. VARIÁVEIS DE ESTADO E SISTEMA DE CHAMADA
    // -------------------------------------------------------------
    let seqNormal = 1;
    let seqPref = 1;
    let historico = [];
    let player = null;
    let isVideoPlaying = false;
    let timerSenha = null;

    // Relógio Digital
    setInterval(() => {
      document.getElementById('clock').innerText = new Date().toLocaleTimeString('pt-BR');
    }, 1000);

    // -------------------------------------------------------------
    // 3. YOUTUBE PLAYER & ESCUTA EM TEMPO REAL DO FIREBASE
    // -------------------------------------------------------------
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        videoId: 'L_LUpnjgPso', // Vídeo inicial padrão
        playerVars: {
          'autoplay': 1,
          'controls': 0,
          'loop': 1,
          'playlist': 'L_LUpnjgPso',
          'origin': window.location.origin
        },
        events: {
          'onStateChange': (event) => {
            if (event.data == YT.PlayerState.PLAYING) isVideoPlaying = true;
            if (event.data == YT.PlayerState.PAUSED) isVideoPlaying = false;
          }
        }
      });
    }

    // Escuta alterações de vídeo enviadas do celular via Firebase
    database.ref('videoAtual').on('value', (snapshot) => {
      const videoId = snapshot.val();
      if (videoId && player && player.loadVideoById) {
        player.loadVideoById(videoId);
      }
    });

    // Gerador do QR Code
    window.addEventListener('load', () => {
      new QRCode(document.getElementById("qrcode"), {
        text: URL_CONTROLE_CELULAR,
        width: 80,
        height: 80
      });
    });

    // -------------------------------------------------------------
    // 4. LÓGICA DE CHAMADA DE SENHAS E ÁUDIO
    // -------------------------------------------------------------
    function chamarSenha(tipo) {
      let num = tipo === 'N' ? seqNormal++ : seqPref++;
      let senhaFormatada = tipo + String(num).padStart(3, '0');
      function chamarSenha(tipo) {
  let num = tipo === 'N' ? seqNormal++ : seqPref++;
  let senhaFormatada = tipo + String(num).padStart(3, '0');
  let bancadaFixa = "Bancada 1"; // <--- BANCADA FIXA AQUI

  // Atualiza Tela
  document.getElementById('currentTicket').innerText = senhaFormatada;
  document.getElementById('currentDesk').innerText = bancadaFixa;

  // Atualiza Histórico
  historico.unshift({ senha: senhaFormatada, bancada: bancadaFixa });
  if (historico.length > 3) historico.pop();
  atualizarHistoricoUI();

  // Ajusta Velocidade do Letreiro
  const marquee = document.getElementById('marqueeText');
  marquee.classList.add('fast-marquee');

  // Pausa Vídeo durante o anúncio
  if (player && isVideoPlaying) player.pauseVideo();

  // Executa os áudios
  tocarSinalEAnunciar(senhaFormatada, bancadaFixa);

  // Timer de 30 segundos para resetar visor
  clearTimeout(timerSenha);
  timerSenha = setTimeout(() => {
    document.getElementById('currentTicket').innerText = '---';
    document.getElementById('currentDesk').innerText = 'Aguardando...';
  }, 30000);
}

    function atualizarHistoricoUI() {
      const list = document.getElementById('historyList');
      list.innerHTML = '';
      for (let i = 0; i < 3; i++) {
        let item = historico[i] || { senha: '---', bancada: '---' };
        list.innerHTML += `<li class="history-item"><span>${item.senha}</span> <span>${item.bancada}</span></li>`;
      }
    }

    // -------------------------------------------------------------
    // 5. ÁUDIO: SINAL.WAV + WEB SPEECH API
    // -------------------------------------------------------------
    function tocarSinalEAnunciar(senha, bancada) {
      let audio = new Audio('sinal.wav');

      audio.play().then(() => {
        audio.onended = () => falarTexto(senha, bancada);
      }).catch(() => {
        // Fallback caso o arquivo de som falhe ou não exista no diretório
        falarTexto(senha, bancada);
      });
    }

    function falarTexto(senha, bancada) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // Limpa chamadas anteriores

        // Trata leitura do código (Ex: N zero zero um)
        let senhaParaVoz = senha.split('').join(' ');
        let mensagem = new SpeechSynthesisUtterance(`Senha ${senhaParaVoz}, dirigir-se à ${bancada}`);
        
        mensagem.lang = 'pt-BR';
        mensagem.rate = 0.9; // Velocidade da voz

        mensagem.onend = () => {
          // Retoma letreiro e vídeo
          document.getElementById('marqueeText').classList.remove('fast-marquee');
          if (player) player.playVideo();
        };

        window.speechSynthesis.speak(mensagem);
      } else {
        if (player) player.playVideo();
      }
    }

    // Modo Tela Cheia para TV Box
    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }
  </script>
</body>
</html>
