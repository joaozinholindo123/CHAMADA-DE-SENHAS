<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Chamadas - Barbearia LC do Corte</title>
  <style>
    :root {
      --bg-dark: #121212;
      --card-bg: #1e1e1e;
      --accent-gold: #ffb703;
      --text-white: #ffffff;
      --text-gray: #b0b0b0;
      --normal-color: #2196f3;
      --pref-color: #e91e63;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Cabeçalho */
    header {
      height: 60px;
      background-color: #080808;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      border-bottom: 2px solid var(--accent-gold);
      z-index: 10;
    }

    .time-display {
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--accent-gold);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .date-display {
      font-size: 1.1rem;
      color: var(--text-gray);
    }

    .btn-header {
      background: #2a2a2a;
      color: white;
      border: 1px solid #444;
      padding: 8px 12px;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-header:hover {
      background: var(--accent-gold);
      color: black;
    }

    /* Zona Hover para Maximizar */
    .fullscreen-trigger {
      position: fixed;
      top: 0;
      right: 0;
      width: 100px;
      height: 60px;
      z-index: 100;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding-right: 10px;
    }

    .fullscreen-trigger #btnFullscreen {
      opacity: 0;
      transition: opacity 0.3s;
    }

    .fullscreen-trigger:hover #btnFullscreen {
      opacity: 1;
    }

    /* Oculta botão em Tela Cheia */
    body:fullscreen #btnFullscreen,
    body:-webkit-full-screen #btnFullscreen {
      display: none !important;
    }

    /* Layout Principal */
    main {
      flex: 1;
      display: flex;
      height: calc(100vh - 120px);
    }

    /* Lado Esquerdo: Vídeo */
    .left-panel {
      flex: 1.2;
      background: #000;
      position: relative;
    }

    .left-panel iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Lado Direito: Senhas */
    .right-panel {
      flex: 1;
      background-color: var(--bg-dark);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      border-left: 1px solid #333;
    }

    /* Display Senha Atual */
    .current-call {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      border: 2px solid #333;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .current-call.active {
      border-color: var(--accent-gold);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(255, 183, 3, 0.4); }
      70% { box-shadow: 0 0 0 15px rgba(255, 183, 3, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 183, 3, 0); }
    }

    .current-title {
      font-size: 1.2rem;
      color: var(--text-gray);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    .current-ticket {
      font-size: 5rem;
      font-weight: 800;
      color: var(--accent-gold);
    }

    .ticket-normal { color: var(--normal-color); }
    .ticket-pref { color: var(--pref-color); }

    /* Controles de Atendimento (Para os Barbeiros) */
    .controls {
      display: flex;
      gap: 10px;
    }

    .btn-call {
      flex: 1;
      padding: 15px;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: white;
      transition: transform 0.1s;
    }

    .btn-call:active { transform: scale(0.98); }
    .btn-normal { background-color: var(--normal-color); }
    .btn-pref { background-color: var(--pref-color); }

    /* Histórico */
    .history-panel {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 15px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .history-title {
      font-size: 1rem;
      color: var(--text-gray);
      margin-bottom: 10px;
      border-bottom: 1px solid #333;
      padding-bottom: 5px;
    }

    .history-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      background: #282828;
      padding: 10px 15px;
      border-radius: 6px;
      font-size: 1.3rem;
      font-weight: bold;
    }

    /* Footer / Letreiro */
    footer {
      height: 60px;
      background-color: #000;
      border-top: 2px solid var(--accent-gold);
      overflow: hidden;
      white-space: nowrap;
      position: relative;
      display: flex;
      align-items: center;
    }

    .ticker-text {
      display: inline-block;
      padding-left: 100%;
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--accent-gold);
      text-transform: uppercase;
    }

    /* Animações do Letreiro */
    .speed-slow {
      animation: ticker 25s linear infinite;
    }

    .speed-fast {
      animation: ticker 12s linear infinite;
      color: #fff;
    }

    @keyframes ticker {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-100%, 0, 0); }
    }
  </style>
</head>
<body>

  <!-- Cabeçalho -->
  <header>
    <div class="time-display" id="clock">00:00:00</div>
    <div class="header-right">
      <div class="date-display" id="date">--/--/----</div>
      <button class="btn-header" onclick="changePlaylist()">🎵 Playlist</button>
    </div>
  </header>

  <!-- Zona Hover de Maximizar (Canto Superior Direito) -->
  <div class="fullscreen-trigger">
    <button class="btn-header" id="btnFullscreen" onclick="toggleFullscreen()">🗖 Maximizar</button>
  </div>

  <!-- Layout Conteúdo -->
  <main>
    <!-- Playlist YouTube -->
    <section class="left-panel">
      <iframe id="ytPlayer" 
        src="https://www.youtube.com/embed/videoseries?list=PL4fGSI1pDJn6jXS_A_s2P1y0y7iJdM5L6&autoplay=1&mute=0" 
        allow="autoplay; encrypted-media" allowfullscreen>
      </iframe>
    </section>

    <!-- Painel de Senhas e Controles -->
    <section class="right-panel">
      <!-- Display Principal -->
      <div class="current-call" id="callCard">
        <div class="current-title">Senha Atual</div>
        <div class="current-ticket" id="currentTicket">---</div>
      </div>

      <!-- Botões para Chamada -->
      <div class="controls">
        <button class="btn-call btn-normal" onclick="callTicket('N')">+ Normal</button>
        <button class="btn-call btn-pref" onclick="callTicket('P')">+ Preferencial</button>
      </div>

      <!-- Histórico -->
      <div class="history-panel">
        <div class="history-title">Últimas Chamadas</div>
        <ul class="history-list" id="historyList">
          <!-- Histórico dinâmico -->
        </ul>
      </div>
    </section>
  </main>

  <!-- Rodapé / Letreiro -->
  <footer>
    <div class="ticker-text speed-slow" id="tickerText">
      BEM-VINDO À BARBEARIA LC DO CORTE! PEÇA A SENHA COM O BARBEIRO E AGUARDE A SUA VEZ. OBRIGADO PELA COMPREENSÃO!
    </div>
  </footer>

  <!-- Áudio Local -->
  <audio id="dingDong" src="sinal.wav" preload="auto"></audio>

  <script>
    // --- Variáveis de Estado ---
    let normalSeq = 0;
    let prefSeq = 0;
    let hideTimer = null;

    const defaultMsg = "BEM-VINDO À BARBEARIA LC DO CORTE! PEÇA A SENHA COM O BARBEIRO E AGUARDE A SUA VEZ. OBRIGADO PELA COMPREENSÃO!";

    // --- Relógio e Data ---
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString('pt-BR');
      
      const options = { weekday: 'short', day: '2-digit', month: '2-digit', year: 'numeric' };
      document.getElementById('date').textContent = now.toLocaleDateString('pt-BR', options);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // --- Sistema de Chamada de Senha ---
    function callTicket(type) {
      let ticketCode = "";
      let typeText = "";

      if (type === 'N') {
        normalSeq++;
        ticketCode = 'N' + String(normalSeq).padStart(3, '0');
        typeText = "NORMAL";
      } else {
        prefSeq++;
        ticketCode = 'P' + String(prefSeq).padStart(3, '0');
        typeText = "PREFERENCIAL";
      }

      // 1. Atualiza Display Principal
      const ticketElem = document.getElementById('currentTicket');
      const cardElem = document.getElementById('callCard');
      
      ticketElem.textContent = ticketCode;
      ticketElem.className = "current-ticket " + (type === 'N' ? 'ticket-normal' : 'ticket-pref');
      cardElem.classList.add('active');

      // 2. Toca Áudio "Ding Dong" Local
      const audio = document.getElementById('dingDong');
      audio.currentTime = 0;
      audio.play().catch(e => console.log("Interação prévia do usuário necessária para áudio automáticos."));

      // 3. Síntese de Voz (Falar pausadamente EX: "P 0 0 1")
      speakTicket(ticketCode);

      // 4. Atualiza Letreiro para MODO CHAMADA
      updateTicker(`📢📢 ATENÇÃO: SENHA ${typeText} ${ticketCode}, DIRIGIR-SE À BANCADA`, true);

      // 5. Adiciona ao Histórico
      addHistory(ticketCode, typeText);

      // 6. Reset após 30 segundos
      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => {
        ticketElem.textContent = "---";
        ticketElem.className = "current-ticket";
        cardElem.classList.remove('active');
        updateTicker(defaultMsg, false);
      }, 30000);
    }

    // --- Falar a Senha Lentamente ---
    function speakTicket(code) {
      if ('speechSynthesis' in window) {
        // Separa letra e números para forçar pausa. Ex: "P 0 0 1"
        const spacedCode = code.split('').join(' ');
        const message = new SpeechSynthesisUtterance(`Senha, ${spacedCode}`);
        
        message.lang = 'pt-BR';
        message.rate = 0.7; // Fala pausada/lenta
        
        // Aguarda 1s para o som do ding dong tocar antes da voz
        setTimeout(() => {
          window.speechSynthesis.speak(message);
        }, 1200);
      }
    }

    // --- Atualizar Letreiro Dinâmico ---
    function updateTicker(text, isFast) {
      const ticker = document.getElementById('tickerText');
      
      // Reinicia animação CSS
      ticker.style.animation = 'none';
      ticker.offsetHeight; /* hack para forçar re-flow */
      
      ticker.textContent = text;
      ticker.className = 'ticker-text ' + (isFast ? 'speed-fast' : 'speed-slow');
    }

    // --- Histórico de Atendimentos ---
    function addHistory(code, type) {
      const historyList = document.getElementById('historyList');
      const li = document.createElement('li');
      li.className = 'history-item';
      
      const time = new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});
      
      li.innerHTML = `<span>${code} <small>(${type})</small></span> <span style="color:#888; font-size: 0.9rem">${time}</span>`;
      
      historyList.insertBefore(li, historyList.firstChild);

      // Mantém no máximo 5 itens no histórico
      if (historyList.children.length > 5) {
        historyList.removeChild(historyList.lastChild);
      }
    }

    // --- Mudar Playlist YouTube ---
    function changePlaylist() {
      const newUrl = prompt("Cole o ID da Playlist ou o Link do Vídeo/Playlist do YouTube:");
      if (newUrl) {
        let embedUrl = "";
        if (newUrl.includes("list=")) {
          const listId = newUrl.split("list=")[1].split("&")[0];
          embedUrl = `https://www.youtube.com/embed/videoseries?list=${listId}&autoplay=1`;
        } else if (newUrl.includes("v=")) {
          const videoId = newUrl.split("v=")[1].split("&")[0];
          embedUrl = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
        } else {
          embedUrl = `https://www.youtube.com/embed/${newUrl}?autoplay=1`;
        }
        document.getElementById('ytPlayer').src = embedUrl;
      }
    }

    // --- Tela Cheia (Fullscreen) ---
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          alert(`Erro ao tentar entrar em tela cheia: ${err.message}`);
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }
  </script>
</body>
</html>
